<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>

.me-form label{font-weight:600;font-size:13px;color:var(--fg2)}
</style></head><body><title>EduCon IBERO Tijuana</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
// ===== EduCon fuera de Claude: datos y sesión en Supabase =====
// Llena estos dos valores con los de tu proyecto (Supabase → Project Settings → API).
const SUPABASE_URL = 'https://jfhyqstfvdbixnjxsrxm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_EEJaaTEXrh0y8j_dq82C4g_kXt8nrYF';

(() => {
  'use strict';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  let session = null;
  const QR = new URLSearchParams(location.search).get('qr');
  if (QR) {
    window.claude = { use: () => new Promise(() => {}) };
    const pinta = () => {
      const ov = document.createElement('div'); ov.id = 'login'; document.body.appendChild(ov);
      ov.innerHTML = `<form class="lg-card" id="qr-form">
        <img alt="IBERO Tijuana" src="${document.querySelector('.side img')?.src || ''}">
        <h1>Registro de asistencia</h1><p>Escribe tu matrícula, o el correo o teléfono con el que te inscribiste.</p>
        <label for="qr-dato">Matrícula, correo o teléfono</label><input id="qr-dato" required autocomplete="email" inputmode="email" placeholder="EC26-0001, tucorreo@gmail.com o 664 123 4567">
        <button type="submit" id="qr-btn">Registrar mi asistencia</button><div id="qr-msg" role="status"></div></form>`;
      try { const v = localStorage.getItem('educon-qr-dato'); if (v) document.getElementById('qr-dato').value = v; } catch (_) {}
      document.getElementById('qr-form').addEventListener('submit', async e => {
        e.preventDefault(); const dato = document.getElementById('qr-dato').value.trim(), msg = document.getElementById('qr-msg'), btn = document.getElementById('qr-btn');
        btn.disabled = true; msg.textContent = 'Registrando…';
        const { data, error } = await sb.rpc('registrar_asistencia_qr', { p_token: QR, p_dato: dato });
        btn.disabled = false;
        if (error) { msg.textContent = 'No se pudo registrar. Intenta de nuevo.'; return; }
        if (data && data.ok) { try { localStorage.setItem('educon-qr-dato', dato); } catch (_) {} document.getElementById('qr-form').innerHTML = `<h1>¡Listo, ${String(data.nombre).replace(/[<>&]/g, '')}!</h1><p>Tu asistencia de hoy quedó registrada. Ya puedes cerrar esta página.</p>`; }
        else msg.textContent = (data && data.error) || 'No se pudo registrar.';
      });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pinta, { once:true }); else pinta();
    return;
  }
  const ready = new Promise(resolve => {
    const done = s => { session = s; hideLogin(); resolve(s); };
    sb.auth.getSession().then(({ data }) => { if (data.session) done(data.session); else showLogin(); });
    sb.auth.onAuthStateChange((ev, s) => { if (s && !session) done(s); if (ev === 'SIGNED_OUT') location.reload(); });
  });

  // ---------- pantalla de acceso ----------
  function showLogin() {
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', showLogin, { once:true }); return; }
    if (document.getElementById('login')) return;
    const box = document.createElement('div');
    box.id = 'login';
    box.innerHTML = `<form class="lg-card" id="lg-form">
      <img alt="IBERO Tijuana" src="${document.querySelector('.side img')?.src || ''}">
      <h1>EduCon IBERO Tijuana</h1>
      <p>Entra con tu correo y contraseña. Si no tienes cuenta, pídela a quien administra la app.</p>
      <label for="lg-email">Correo</label>
      <input id="lg-email" type="email" required autocomplete="username" placeholder="tucorreo@tijuana.ibero.mx">
      <label for="lg-pass">Contraseña</label>
      <input id="lg-pass" type="password" required autocomplete="current-password">
      <button type="submit" id="lg-btn">Entrar</button>
      <div id="lg-msg" role="status"></div></form>`;
    document.body.appendChild(box);
    const urlErr = new URLSearchParams(location.hash.slice(1) || location.search).get('error_description');
    if (urlErr) document.getElementById('lg-msg').textContent = 'La liga ya no es válida. Entra con tu correo y contraseña.';
    document.getElementById('lg-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('lg-email').value.trim(), password = document.getElementById('lg-pass').value, msg = document.getElementById('lg-msg'), btn = document.getElementById('lg-btn');
      btn.disabled = true; msg.textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      msg.textContent = !error ? '' : /invalid login credentials/i.test(error.message) ? 'Correo o contraseña incorrectos.' : /not confirmed/i.test(error.message) ? 'Tu cuenta aún no está confirmada. Pide a quien administra la app que la confirme.' : 'No se pudo entrar: ' + error.message;
    });
  }
  function hideLogin() { document.getElementById('login')?.remove(); }

  // ---------- base de datos (misma forma que la usaba la app en Claude) ----------
  const listeners = {}; // col -> Set(cb)
  const cache = {};     // col -> Map(id -> data)
  let channel = null;
  const emit = col => { const m = cache[col]; const snap = { docs: [...m].map(([id, d]) => ({ id, exists: true, data: () => d })), metadata: { hasPendingWrites: false } }; (listeners[col] || new Set()).forEach(cb => { try { cb(snap); } catch (e) { console.error(e); } }); };
  function ensureChannel() {
    if (channel) return;
    channel = sb.channel('docs-en-vivo').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
      const row = p.eventType === 'DELETE' ? p.old : p.new; const col = row && row.col; if (!col || !cache[col]) return;
      if (p.eventType === 'DELETE') cache[col].delete(row.id); else cache[col].set(row.id, row.data);
      emit(col);
    }).subscribe();
  }
  async function load(col) {
    const m = new Map(); let from = 0;
    for (;;) {
      const { data, error } = await sb.from('docs').select('id,data').eq('col', col).range(from, from + 999);
      if (error) throw error; data.forEach(r => m.set(r.id, r.data)); if (data.length < 1000) break; from += 1000;
    }
    cache[col] = m;
  }
  function collection(col) {
    return {
      onSnapshot(cb, onErr) {
        (listeners[col] = listeners[col] || new Set()).add(cb); ensureChannel();
        (cache[col] ? Promise.resolve() : load(col)).then(() => emit(col)).catch(e => onErr && onErr(e));
        return () => listeners[col].delete(cb);
      },
      doc: id => docRef(col, id),
    };
  }
  function docRef(col, id) {
    return {
      async set(data) {
        const { error } = await sb.from('docs').upsert({ col, id, data, updated_at: new Date().toISOString(), updated_by: session.user.id });
        if (error) throw error;
        if (cache[col]) { cache[col].set(id, data); emit(col); }
      },
      async delete() {
        const { error } = await sb.from('docs').delete().eq('col', col).eq('id', id);
        if (error) throw error;
        if (cache[col]) { cache[col].delete(id); emit(col); }
      },
      onSnapshot(cb, onErr) {
        return collection(col).onSnapshot(snap => { const d = snap.docs.find(x => x.id === id); cb({ exists: !!d, data: () => d ? d.data() : undefined }); }, onErr);
      },
    };
  }
  async function bulk(col, items) {
    const now = new Date().toISOString();
    const { error } = await sb.from('docs').upsert(items.map(({ id, data }) => ({ col, id, data, updated_at: now, updated_by: session.user.id })));
    if (error) throw error;
    if (cache[col]) { items.forEach(({ id, data }) => cache[col].set(id, data)); emit(col); }
  }
  const db = { collection, bulk, doc: path => { const [c, i] = path.split('/'); return docRef(c, i); } };

  // ---------- usuarios ----------
  const profCache = new Map();
  const toProfile = r => ({ id: r.id, name: r.nombre || (r.email || '').split('@')[0], email: r.email, avatarUrl: r.avatar_url || avatarFor(r.nombre || r.email || '?'), isMe: r.id === session.user.id, guest: false });
  function avatarFor(n) {
    const ini = n.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="hsl(${h},45%,62%)"/><text x="20" y="25" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">${ini}</text></svg>`);
  }
  const user = {
    id: async () => session.user.id,
    me: async () => (await user.profiles([session.user.id]))[session.user.id],
    isOwner: () => false, canEdit: () => true, can: async () => true,
    async rol() { const { data } = await sb.from('perfiles').select('rol').eq('id', session.user.id).maybeSingle(); return (data && data.rol) || 'coordinacion'; },
    async equipo() { const { data } = await sb.from('perfiles').select('id,nombre,email,rol').order('nombre'); return data || []; },
    async asignarRol(id, rol) { const { error } = await sb.rpc('asignar_rol', { p_usuario: id, p_rol: rol }); if (error) throw error; },
    async profiles(ids) {
      const need = ids.filter(i => !profCache.has(i));
      if (need.length) { const { data } = await sb.from('perfiles').select('*').in('id', need); (data || []).forEach(r => profCache.set(r.id, toProfile(r))); }
      return Object.fromEntries(ids.map(i => [i, profCache.get(i) || { id: i, name: '', avatarUrl: avatarFor('?'), isMe: false }]));
    },
    async search(q) {
      let qb = sb.from('perfiles').select('*').order('nombre').limit(20);
      if (q) qb = qb.or(`nombre.ilike.%${q.replace(/[%,()]/g, '')}%,email.ilike.%${q.replace(/[%,()]/g, '')}%`);
      const { data } = await qb; return (data || []).map(r => { const p = toProfile(r); profCache.set(r.id, p); return p; });
    },
  };

  // ---------- descargas ----------
  const downloads = { async save({ filename, data }) { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } };

  window.claude = { use: async name => { if (name === 'downloads') return downloads; await ready; return name === 'db' ? db : name === 'user' ? user : null; } };

  // ---------- mi perfil y salir ----------
  ready.then(async () => {
    if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once:true }));
    const foot = document.querySelector('.side .foot'); if (!foot) return;
    const me = (await user.profiles([session.user.id]))[session.user.id];
    const box = document.createElement('div'); box.className = 'me-box';
    box.innerHTML = `<button class="btn-x" id="me-btn" type="button" title="Tu nombre en la app"><img class="me-av" alt="" src="${me.avatarUrl}"><span class="lab" id="me-name"></span></button><button class="btn-x" id="out-btn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17l5-5-5-5M20 12H9M12 21H5a2 2 0 01-2-2V5a2 2 0 012-2h7"/></svg></button>`;
    foot.prepend(box); document.getElementById('me-name').textContent = me.name || session.user.email;
    document.getElementById('out-btn').onclick = () => sb.auth.signOut();
    document.getElementById('me-btn').onclick = () => {
      const f = document.createElement('form'); f.className = 'me-form';
      f.innerHTML = `<label for="me-in">Tu nombre</label><input id="me-in" class="in"><label for="me-pw">Nueva contraseña (opcional)</label><input id="me-pw" class="in" type="password" autocomplete="new-password" placeholder="Déjala vacía para no cambiarla"><div id="me-msg" class="small"></div><div class="tools"><button class="btn pri" type="submit">Guardar</button><button class="btn ghost" type="button" id="me-x">Cancelar</button></div>`;
      document.body.appendChild(f); const inp = f.querySelector('#me-in'); inp.value = me.name || ''; inp.focus();
      f.querySelector('#me-x').onclick = () => f.remove();
      f.onsubmit = async e => { e.preventDefault(); const nombre = inp.value.trim(); if (!nombre) return;
        const pw = f.querySelector('#me-pw').value; if (pw) { if (pw.length < 8) { f.querySelector('#me-msg').textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; } const { error } = await sb.auth.updateUser({ password: pw }); if (error) { f.querySelector('#me-msg').textContent = 'No se pudo cambiar la contraseña: ' + error.message; return; } }
        await sb.from('perfiles').update({ nombre }).eq('id', session.user.id); me.name = nombre; profCache.delete(session.user.id);
        document.getElementById('me-name').textContent = nombre; f.remove(); window.dispatchEvent(new HashChangeEvent('hashchange')); };
    };
  });
})();

</script>

<style>

}

  --hatch:rgba(165,152,149,.16); color-scheme:dark }}

<script>
(() => {
'use strict';
// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const horarioDe = (g, d) => ((g.horarioDia || {})[pd(d).getDay()] || g.horario || '').replace(/^(Lun|Mar|Mié|Jue|Vie|Sáb|Dom)\s+/, '');
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const TODAY = ds(new Date());
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const fd = (s, y = true) => { if (!s) return '—'; const d = pd(s); return `${d.getDate()} ${MES[d.getMonth()]}${y ? ' ' + d.getFullYear() : ''}`; };
const fdw = s => { const d = pd(s); return `${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const money = n => n == null || n === '' ? '—' : '$' + Number(n).toLocaleString('es-MX');
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

const SEDES = ['Campus Río','Campus Playas','Coparmex','En línea','Sede de la empresa'];
const SALONES = { 'Campus Playas':['Salón 319','Salón 320'], 'Campus Río':['Primer piso','Segundo piso'] };
const HORARIOS = ['9:00–13:00','9:00–14:00','10:00–14:00','16:00–20:00','17:00–21:00','18:00–21:00','18:00–22:00','7:00–9:00'];
// ---------- colaboradores (organizaciones de Vinculación con logo) ----------
const colabsDe = g => (g.colabs || []).map(oid => [oid, S.orgs[oid]]).filter(([, o]) => o);
const logoImg = (o, h = 22, cls = '') => o.logo ? `<img class="clogo ${cls}" src="${o.logo}" alt="${esc(o.nombre)}" title="${esc(o.nombre)}" style="height:${h}px">` : `<span class="clogo ctxt ${cls}" title="${esc(o.nombre)}" style="height:${h}px;line-height:${h}px;font-size:${Math.max(10, Math.round(h * .5))}px">${esc(o.nombre)}</span>`;
const colabStrip = (g, h) => { const c = colabsDe(g); return c.length ? `<span class="cstrip">${c.map(([, o]) => logoImg(o, h)).join('')}</span>` : ''; };
// Recorta márgenes vacíos (transparentes o blancos) y deja el logo a máx. 400 px
function recortarLogo(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onerror = rej; im.onload = () => {
    const c0 = document.createElement('canvas'); c0.width = im.width; c0.height = im.height; const x0 = c0.getContext('2d'); x0.drawImage(im, 0, 0);
    const { data } = x0.getImageData(0, 0, im.width, im.height); let t = im.height, l = im.width, b = -1, r = -1;
    for (let y = 0; y < im.height; y++) for (let x = 0; x < im.width; x++) { const i = (y * im.width + x) * 4; if (data[i + 3] > 16 && !(data[i] > 242 && data[i + 1] > 242 && data[i + 2] > 242)) { if (x < l) l = x; if (x > r) r = x; if (y < t) t = y; if (y > b) b = y; } }
    if (r < 0) { r = im.width - 1; b = im.height - 1; l = 0; t = 0; }
    const p = 3; l = Math.max(0, l - p); t = Math.max(0, t - p); r = Math.min(im.width - 1, r + p); b = Math.min(im.height - 1, b + p);
    const w = r - l + 1, h = b - t + 1, k = Math.min(1, 400 / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(c0, l, t, w, h, 0, 0, c.width, c.height); let u = c.toDataURL('image/webp', .92); if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/png'); res(u); }; im.src = src; });
}
function subirLogo(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => recortarLogo(r.result).then(res, rej); r.readAsDataURL(file); });
}
let logosRevisados = false;

const T_EST = ['No iniciada','En curso','Completada'];

function tLink(t) {

}
function dueTag(t) {

  const late = !done && t.vence < TODAY, today = !done && t.vence === TODAY;
  return `<span class="due ${late ? 'late' : today ? 'today' : ''}">${late ? 'Vencida · ' : today ? 'Hoy · ' : ''}${fd(t.vence, t.vence.slice(0, 4) !== TODAY.slice(0, 4))}</span>`;

function vPendientes() {
  const q = norm(ui.tQ);
  let L = Object.entries(S.tareas || {}).filter(([, t]) => (!ui.tMine || (myId && (t.asignados || []).includes(myId))) && (!q || norm(t.titulo + ' ' + (t.descripcion || '') + ' ' + (t.asignadosTexto || []).join(' ')).includes(q)));
  const sortT = (a, b) => (a[1].vence || '9999').localeCompare(b[1].vence || '9999') || T_PRI.indexOf(a[1].prioridad) - T_PRI.indexOf(b[1].prioridad) || (a[1].creado || '').localeCompare(b[1].creado || '');
  let cols = [];
  if (ui.tGroup === 'estado') cols = T_EST.map(e => ({ k:e, n:e, drop:e, items:L.filter(([, t]) => (t.estado || 'No iniciada') === e) }));
  else if (ui.tGroup === 'prioridad') cols = T_PRI.map(p => ({ k:p, n:p, items:L.filter(([, t]) => (t.prioridad || 'Media') === p) }));
  else if (ui.tGroup === 'vence') {
    const wk = addDays(TODAY, 7);
    const b = t => t.estado === 'Completada' ? 'Completadas' : !t.vence ? 'Sin fecha' : t.vence < TODAY ? 'Vencidas' : t.vence === TODAY ? 'Hoy' : t.vence <= wk ? 'Esta semana' : 'Más adelante';
    cols = ['Vencidas','Hoy','Esta semana','Más adelante','Sin fecha','Completadas'].map(k => ({ k, n:k, items:L.filter(([, t]) => b(t) === k) })).filter(c => c.items.length || ['Vencidas','Hoy','Esta semana'].includes(c.k));

function faltantes() {
  const out = { gens:[], mods:[], profes:[], profesOtros:0, orgs:[], orgsOtros:0, progs:[], okGens:0, totGens:0 };
  const vivos = D.gens.filter(x => ['Activo','En lanzamiento','En planeación'].includes(x.st));
  out.totGens = vivos.length;
  for (const x of vivos) {
    const falta = [...x.missing, ...(x.st !== 'Activo' && !x.g.meta ? ['meta de inscritos'] : [])];
    if (falta.length) out.gens.push({ x, falta }); else out.okGens++;
    for (const m of x.sc.mods) {
      const f = []; if (!m.nombre) f.push('nombre'); if (!m.profesorId) f.push('profesor'); else if (m.estatusProfe !== 'Confirmado') f.push('confirmar profesor'); if (!m.ses.length && !m.clases) f.push('nº de clases'); if (m.alta !== true && x.st !== 'Concluido') f.push('alta en sistema');
      if (f.length) out.mods.push({ x, m, f });
    }
  }
  const usados = new Set(); vivos.forEach(x => x.sc.mods.forEach(m => m.profesorId && usados.add(m.profesorId)));
  for (const [id, p] of Object.entries(S.profes)) {
    const f = []; if (!p.telefono) f.push('teléfono'); if (!p.correo) f.push('correo'); if (!p.licenciatura && !p.maestria) f.push('formación'); if (!p.areas) f.push('áreas');
    if (!f.length) continue;
    if (usados.has(id) || !p.telefono && !p.correo) out.profes.push({ id, p, f, activo:usados.has(id) }); else out.profesOtros++;
  }
  out.profes.sort((a, b) => b.activo - a.activo || a.p.nombre.localeCompare(b.p.nombre));
  for (const [id, o] of Object.entries(S.orgs)) {
    if (o.etapa === 'Descartado') continue;
    const f = []; if (!o.contacto) f.push('contacto'); if (!o.correo && !o.telefono) f.push('correo o teléfono'); if (!o.responsable) f.push('responsable IBERO');
    if (!f.length) continue;
    if (['Estratégica','Alta'].includes(o.prioridad) || o.etapa !== 'Prospecto') out.orgs.push({ id, o, f }); else out.orgsOtros++;
  }
  out.orgs.sort((a, b) => PRIOR.indexOf(a.o.prioridad) - PRIOR.indexOf(b.o.prioridad));
  for (const [id, p] of Object.entries(S.programas)) {
    if (p.oferta === 'Pausado') continue;
    const f = []; if (!p.area) f.push('área'); if (!Number(p.horas)) f.push('horas totales'); if (!esqAuto(id, p) || esqAuto(id, p) === 'ninguno') f.push('esquema de precios');
    if (f.length) out.progs.push({ id, p, f });
  }
  return out;
}

function mesesDesde(ini) { const a = pd(ini), t = pd(TODAY); return (t.getFullYear() - a.getFullYear()) * 12 + t.getMonth() - a.getMonth() - (t.getDate() < a.getDate() ? 1 : 0); }
function cobro(a) {

  const pagos = (a.pagos || []); const pagado = pagos.reduce((s, p) => s + neto(p), 0); const recargos = pagos.reduce((s, p) => s + (Number(p.recargo) || 0), 0);
  const ult = pagos.map(p => p.fecha).filter(Boolean).sort().pop() || null;

  const m2 = String(v || '').match(/^\s*(\d{4})-(\d{2})-(\d{2})/); return m2 ? `${m2[1]}-${m2[2]}-${m2[3]}` : null;

    for (const r of rows) { if (!xtxt(r['RFC']) && !xtxt(r['Razón social'])) continue; const d = {}; for (const [k, v] of Object.entries(F)) if (xtxt(r[k])) d[v] = xtxt(r[k]); fis.push({ correo:norm(r['Correo-e']), nombre:norm(`${xtxt(r['Nombre(s)'])} ${xtxt(r['Apellidos'])}`), d }); } }
