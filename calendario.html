<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de clases · IBERO Tijuana</title>
<meta name="description" content="Agrega las fechas de tus clases de Educación Continua IBERO Tijuana a tu calendario.">
<style>
:root{--ink:#231f1e;--vino:#8A1538;--gris:#666;--linea:#e0e0e0;--bg:#f4f4f4;--card:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f2f2f2;--gris:#b5b5b5;--linea:#3a3a3a;--bg:#161616;--card:#222}}
:root[data-theme="dark"]{--ink:#f2f2f2;--gris:#b5b5b5;--linea:#3a3a3a;--bg:#161616;--card:#222}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.hd{background:#231f1e;border-bottom:4px solid var(--vino);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:14px}
.hd img{height:34px} .hd small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ccc} .hd b{font-size:16px}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:10px;padding:20px 18px;border:1px solid var(--linea)}
h1{font-size:21px;line-height:1.25;margin:0 0 4px} .sub{color:var(--vino);font-weight:700;font-size:14px;margin:0 0 14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sub{color:#e0738f}}
dl{margin:0 0 6px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px} dt{color:var(--gris)} dd{margin:0}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:22px 0 10px}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--linea);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:16px;font-weight:700;min-height:56px}
.btn span{display:block;font-weight:400;font-size:13px;color:var(--gris);margin-top:2px}
.btn.pri{background:var(--vino);border-color:var(--vino);color:#fff} .btn.pri span{color:#f3d6de}
.btn svg{flex:none;width:26px;height:26px}
.nota{font-size:13px;color:var(--gris);line-height:1.5;margin-top:16px}
.err{text-align:center;padding:30px 10px;color:var(--gris)}
footer{text-align:center;font-size:12px;color:var(--gris);margin-top:22px;line-height:1.6}
footer a{color:inherit}
</style>
</head>
<body>
<div class="hd"><img src="ibero-logo.png" alt="IBERO Tijuana"><div><small>Educación Continua</small><b>Calendario de clases</b></div></div>
<main id="m"><div class="card err">Cargando…</div></main>
<footer>Educación Continua · IBERO Tijuana<br>Tel. <a href="tel:+526646301577">(664) 630 1577</a> · <a href="https://educon.iberotijuana.edu.mx">educon.iberotijuana.edu.mx</a></footer>
<script>
(function () {
  var FN = 'https://jfhyqstfvdbixnjxsrxm.supabase.co/functions/v1/calendario';
  var g = (new URLSearchParams(location.search).get('g') || '').replace(/[^\w-]/g, '');
  var m = document.getElementById('m');
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var fecha = function (s) { if (!s) return ''; var p = s.split('-'); return +p[2] + ' de ' + MES[+p[1] - 1] + ' de ' + p[0]; };
  if (!g) { m.innerHTML = '<div class="card err">Escanea el código QR de tu hoja de calendario para ver tus clases.</div>'; return; }
  var https = FN + '?g=' + encodeURIComponent(g);
  var webcal = https.replace(/^https:/, 'webcal:');
  var google = 'https://calendar.google.com/calendar/render?cid=' + encodeURIComponent(webcal);
  var ua = navigator.userAgent; var ios = /iPhone|iPad|iPod|Macintosh/.test(ua); var android = /Android/.test(ua);
  var ic = {
    apple: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>',
    google: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2" fill="#fff" stroke="#4285F4" stroke-width="2"/><path d="M3 8h18" stroke="#4285F4" stroke-width="2"/><text x="12" y="18" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#4285F4">31</text></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>'
  };
  var bApple = '<a class="btn ' + (ios ? 'pri' : '') + '" href="' + webcal + '">' + ic.apple + '<div>iPhone, iPad o Mac<span>Se abre Calendario: toca «Suscribirse»</span></div></a>';
  var bGoogle = '<a class="btn ' + (android ? 'pri' : '') + '" href="' + google + '">' + ic.google + '<div>Android · Google Calendar<span>Inicia sesión con tu cuenta de Google y toca «Agregar»</span></div></a>';
  var bFile = '<a class="btn" href="' + https + '&dl=1">' + ic.file + '<div>Descargar archivo<span>Para Outlook u otro calendario (.ics)</span></div></a>';
  fetch(https + '&f=json').then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (d) {
    document.title = d.nombre + ' · Calendario de clases';
    m.innerHTML = '<div class="card"><h1>' + esc(d.nombre) + '</h1><p class="sub">Generación ' + esc(d.gen) + '</p>' +
      '<dl><dt>Periodo</dt><dd>' + fecha(d.ini) + ' – ' + fecha(d.fin) + '</dd><dt>Horario</dt><dd>' + esc(d.horario) + '</dd><dt>Sede</dt><dd>' + esc(d.sede) + '</dd><dt>Clases</dt><dd>' + esc(d.n) + ' sesiones</dd></dl></div>' +
      '<h2>Agrega tus clases a tu calendario</h2>' + (android ? bGoogle + bApple : bApple + bGoogle) + bFile +
      '<p class="nota">Con iPhone y Google Calendar quedas <b>suscrito</b>: si alguna fecha cambia, tu calendario se actualiza solo. Cada clase trae un recordatorio una hora antes.</p>';
  }).catch(function () {
    m.innerHTML = '<div class="card err">Este calendario todavía no está disponible. Pide ayuda a Educación Continua al (664) 630 1577.</div>';
  });
})();
</script>
</body>
</html>
